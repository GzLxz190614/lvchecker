name: lvchecker
description: "中二节奏 2027 连章（Linked VERSE）门解锁进度记录工具"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 从仓库根目录的 icon.png 生成各密度的 Android 启动图标。
  # 由 CI 执行 `dart run flutter_launcher_icons`，本地无需 Flutter。
  flutter_launcher_icons: ^0.14.1

flutter:
  # 必须为 true。
  # 代码里用了 Icons.*（chevron_right / check_circle / settings_outlined 等），
  # 这些字形来自 MaterialIcons 字体。设为 false 时编译器不报错，
  # 但运行时所有图标会变成空白方块——这种「编译过但看起来坏了」的坑很难查。
  uses-material-design: true

  # ------------------------------------------------------------------
  # 资源列表：**必须逐文件列出**，不能只写目录。
  #
  # Flutter 的 assets 声明不递归子目录：声明 `assets/img/music/` 时，
  # `assets/img/music/51/jacket.png` 这类三级路径不会被 pack 进包。  # 结果是编译成功、analyze 无 error、运行时却满屏「图片丢失」。
  #
  # 下面这段由 tools/gen_asset_list.py 生成（tools/build.py 也会调用），
  # 请勿手动编辑。新增曲目后重跑 tools/build.py 即可。
  # ------------------------------------------------------------------
  assets:
    - data/classes.json
    - data/gates.json
    - data/linklevels.json
    - data/meta.json
    - assets/img/avatar/6104401/icon.png
    - assets/img/avatar/6104401/tex.png
    - assets/img/avatar/6204401/icon.png
    - assets/img/avatar/6204401/tex.png
    - assets/img/avatar/6704401/icon.png
    - assets/img/avatar/6704401/tex.png
    - assets/img/chara/24320/image.png
    - assets/img/music/100/jacket.png
