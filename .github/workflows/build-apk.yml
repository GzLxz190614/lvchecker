name: Build APK

# 只在「手动触发」或「打 tag」时构建。
# 刻意不配 on: push 到分支——否则每次推代码都烧 Actions 额度，
# 失败还会发邮件。改数据/改代码随时推，不影响这里。
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过 analyze/test（仅当测试本身出问题时用，快速出包）'
        type: boolean
        default: false
      publish_release:
        description: '构建完直接发一个 Release（测试版，预发布标记）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 锁定具体的 Flutter 版本，不用 channel: stable。
      # 否则上游发新版可能让构建在最不方便的时候突然红。
      # 要升级时改这一行并手动跑一次即可。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      # ------------------------------------------------------------------
      # 生成 Android 工程壳。
      #
      # 为什么不在仓库里提交 android/：
      #   那需要我手写 gradle 版本、AGP 版本、Kotlin 版本、wrapper 四件套。
      #   只要有一处和当前 Flutter 版本不匹配，CI 就会红，而且要反复试。
      #   交给 flutter create 用「与当前 Flutter 版本配套」的模板生成，
      #   是一次到位且零维护的做法。
      #
      # 为什么这样安全：
      #   flutter create 只会补齐缺失的平台文件，**不会覆盖**已有的
      #   lib/main.dart、pubspec.yaml、test/、data/、assets/。
      #   通过下面的 Assert 步骤显式校验这一点。
      # ------------------------------------------------------------------
      - name: Generate Android project shell
        run: flutter create --platforms=android --org io.github.gzlxz190614 .

      # 确认 `flutter create` 没有覆盖我们的源文件，且关键资源都在。
      #
      # ⚠️ 这一段以前是写死路径的 shell（`test -f assets/img/music/51/jacket.png`），
      #    图片格式从 PNG 换成 WebP 时它**直接挂了** —— 改格式的人不会想到
      #    去改 workflow 里的 shell。讽刺的是这个断言存在的意义就是防止资源
      #    出问题，结果它成了唯一因为资源改名而挂掉的东西。
      #
      #    现在改成调脚本，扩展名从 build.py 的 IMG_EXT 取（唯一真源），
      #    而且本地就能跑（`python tools/verify_repo.py`），不用推到 CI 试错。
      #
      #    注意 manifest 的检查**不在这里** —— 模板里本来就没有 INTERNET 权限，
      #    要等下面 patch 完再带 --expect-manifest 查一次（顺序搞反会误报）。
      - name: Verify repo invariants (sources not overwritten, assets)
        run: |
          set -e
          python3 tools/verify_repo.py
          test -f android/app/src/main/AndroidManifest.xml

      # ------------------------------------------------------------------
      # 改包名并把 minSdk 抬到 29（Android 10）。
      # Flutter 默认 minSdk 是 21，必须显式抬高才能保证你的常用机不变砖。
      # 用宽容匹配（同时兼容 `= 值` 与 `值` 两种写法），避免模板格式变化导致漏改。
      # ------------------------------------------------------------------
      - name: Set applicationId and minSdk = 29
        run: |
          set -e
          F=android/app/build.gradle.kts

          # 包名：io.github.gzlxz190614.lvchecker
          sed -i -E 's/^([[:space:]]*applicationId[[:space:]]*=[[:space:]]*).*$/\1"io.github.gzlxz190614.lvchecker"/' "$F"

          # minSdk：先尝试替换既有的 minSdk 行
          if grep -qE '^[[:space:]]*minSdk[[:space:]]*=' "$F"; then
            sed -i -E 's/^([[:space:]]*minSdk[[:space:]]*=[[:space:]]*).*$/\1 29/' "$F"
          else
            # 没有就插到 defaultConfig { 之后
            sed -i -E 's/^([[:space:]]*defaultConfig[[:space:]]*\{[[:space:]]*)$/\1\n        minSdk = 29/' "$F"
          fi

          echo '----- build.gradle.kts 关键行 -----'
          grep -nE 'applicationId|minSdk|namespace|compileSdk|targetSdk' "$F" || true

          echo '----- 断言：两项都改到了 -----'
          grep -q 'io.github.gzlxz190614.lvchecker' "$F"
          grep -qE 'minSdk[[:space:]]*=[[:space:]]*29' "$F"
          echo "OK: applicationId 与 minSdk=29 已生效"

      # 应用显示名 + **联网权限**。
      #
      # ⚠️ INTERNET 权限是必须在 release 里显式声明的，这是本项目最隐蔽的一个坑：
      #   `flutter create` 生成的模板里，INTERNET 只写在 debug/profile 的 manifest 里
      #   （那是给 Flutter 工具连 VM Service 用的），**主 manifest 里没有**。
      #   而 release APK 用主 manifest，所以**默认完全不能联网**。
      #
      #   它的表现非常像「被墙」：所有请求都抛 Failed host lookup（域名解析失败），
      #   于是「每个源都不通」看起来像网络问题，实际上 app 连 DNS 都没权限查。
      #
      #   实测症状：手机浏览器打开 raw 链接正常，但 app 里 6 个数据源**全部**报
      #   「域名解析失败」——连国内域名 Gitee 都不通。
      #   **「所有域名一起失败」就是缺权限的指纹**；真被墙只会是部分域名失败。
      #
      #   漏掉权限时**不会有任何编译期报错**，所以把补丁和断言都放进这个脚本，
      #   它自己会校验并在不满足时非零退出（见 tools/patch_android_manifest.py）。
      #   为什么不用 sed 内联：sed 的插入没法在本地验证，失败时 APK 照样能构建成功，
      #   只有装到手机上才会发现「又不能联网了」——又是一个「假绿勾」。
      - name: Set app display name and INTERNET permission
        run: |
          set -e
          python3 tools/patch_android_manifest.py \
            --manifest android/app/src/main/AndroidManifest.xml \
            --label "Linked VERSE Checker"

      # 补丁打完之后再验一次 manifest。
      #
      # 为什么不在上面那个脚本里一起查：patch 脚本自己验的是「我刚写进去的东西」，
      # 而这个脚本验的是「文件现在的状态」。两者都会抓到问题，但后者是独立的第二双眼睛
      # —— 万一以后有人加了别的步骤去改 manifest（flavor / manifest merger 之类），
      # 它还能兜住。
      - name: Verify manifest after patching
        run: python3 tools/verify_repo.py --expect-manifest

      - name: Get dependencies
        run: flutter pub get

      # 装 Pillow：工具脚本用它读写图片（见 tools/check_image_format.py）。
      #
      # 为什么 CI 需要它：仓库里的图是**已生成**的（工作流不重新生成图片），
      # 但 check_image_format.py 要打开图片、读出真实格式，才能发现
      # 「扩展名 .webp 实际是 PNG」这类问题 —— 那种问题编译期不报错，
      # 只有装到手机才满屏「图片丢失」。
      #
      # 顺带也保证了「这个仓库随时可以重新生成图片」：如果哪天源码要重建，
      # 不会因为 CI 里没有 Pillow 才发现。
      #
      # 装它大概几秒，相对于整个构建可以忽略。
      - name: Set up Python imaging (Pillow)
        run: |
          set -e
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "Pillow>=10"
          python3 -c "import PIL, PIL.features; print('Pillow', PIL.__version__)"
          python3 -c "import PIL.features, sys; sys.exit(0 if PIL.features.check('webp') else 1)"
          echo "OK: Pillow 可用且支持 WebP"

      # ------------------------------------------------------------------
      # 本地检查（因为无法在本地跑 flutter，这些静态校验就放在 CI 里）
      # ------------------------------------------------------------------
      - name: Static checks (dart / assets / classes / image format)
        run: |
          set -e
          # 先按磁盘现状重建资源列表，再校验（避免「加了图但忘了声明」漏过）
          python3 tools/gen_asset_list.py
          python3 tools/check_dart.py
          python3 tools/check_assets.py
          python3 tools/check_classes.py
          # 图片格式：确认 Pillow 支持目标格式，且仓库里的图扩展名与实际格式一致。
          # 这两种问题的共同点是编译期发现不了，只有装到手机才满屏「图片丢失」。
          python3 tools/check_image_format.py
          # manifest 补丁脚本的自检。它负责的是「APK 有没有联网权限」，
          # 自己错了就毫无意义，所以在构建之前先验证它的逻辑（含失败路径）。
          python3 tools/patch_android_manifest.py --self-test

      # 从仓库根目录的 icon.png 生成各密度启动图标。
      # 必须在 flutter pub get 之后跑（它依赖 flutter_launcher_icons 包）。
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # analyze 的 info/warning 不阻断（不该因为 lint 提示就出不了包），
      # **但 error 必须阻断**。
      #
      # 为什么这样写：Run #1 时这一步报了 2 个 error（undefined_class 等），
      # 却因为在 UI 上显示 success 而被忽略——问题只写在日志文字里。
      # 下面显式把 error 数出来并让它失败，避免再次出现「假绿勾」。
      - name: Analyze
        if: ${{ !inputs.skip_tests }}
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          cat analyze.log
          set -e
          # 匹配行的开头是 error 加空格（不依赖那个项目符号字符，避免编码差异）
          if grep -qE '^[[:space:]]*error[[:space:]]' analyze.log; then
            echo ""
            echo "❌ analyze 报了 error，构建中止。"
            echo "（info/warning 不阻断，error 阻断）"
            exit 1
          fi
          echo "OK: analyze 没有 error"

      # test 是阻断的：模型解析错了会导致整个 app 显示错数据，必须拦住。
      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: flutter test

      # 通用单包（不加 --split-per-abi），保证 Android 10 老机也能装。
      - name: Build release APK
        run: flutter build apk --release

      # 确认打出来的 APK **真的**带上了联网权限。
      #
      # 为什么要查「成品」而不是只查 manifest：manifest 补丁成功 ≠ APK 里有权限。
      # 中间还可能被 manifest merger、flavor、或别的 manifest 覆盖掉。
      # 之前那次「六个源全部域名解析失败」的教训就是：**构建成功不等于功能可用**，
      # 必须拿最终产物验证。aapt 在 Android SDK build-tools 里，runner 上一定有。
      - name: Show APK info
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/
          du -h "$APK"

          # 用 mapfile 而不是 `AAPT=$(find ... | sort | tail)`：后者在 `set -e` 下
          # 一旦 find 什么都没找到就会**静默退出整个步骤**，连下面那句人话错误都打不出来。
          # （`|| true` 能兜住管道最后一段，但读起来容易误解，不如显式判断。）
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mapfile -t AAPT_CANDIDATES < <(find "$SDK/build-tools" -name aapt -type f 2>/dev/null | sort -V)
          if [ "${#AAPT_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::在 $SDK/build-tools 下找不到 aapt，无法验证 APK 权限"
            exit 1
          fi
          AAPT="${AAPT_CANDIDATES[-1]}"
          echo "使用 $AAPT"

          echo '----- APK 里的权限 -----'
          # 先落到文件再 grep。不写成 `if aapt dump ... | grep -q` 是因为那样
          # aapt 自己失败（比如 APK 损坏）会被当成「没有这个权限」，报出误导性的原因。
          # 先让 aapt 跑完并检查退出码，再单独判断权限在不在。
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt

          echo '----- 断言：APK 必须声明 INTERNET -----'
          if grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo "OK: APK 已带 INTERNET 权限，热更新才有网络可用"
          else
            echo "::error::APK 里没有 INTERNET 权限 —— 装上去会完全无法联网（所有源都报域名解析失败）"
            exit 1
          fi

      # 发 Release：附件不计入 Actions 存储额度，而且给出一个固定下载链接，
      # 手机上点开就能装。
      #
      # 两条触发路径、都能标「预发布」：
      #   · 打 tag（v0.2.0-rc.1 这种带后缀的）→ 自动标 prerelease
      #   · 手动触发并勾上 publish_release → 用 run number 当 tag，标 prerelease
      #
      # 为什么 tag 里带 `-` 就自动当预发布：这样「测试版」不需要额外操作，
      # 只要是 v0.2.0-rc.1 / v0.2.0-test.1 这类 tag，GitHub 上就不会显示成 Latest。
      # 反之 v0.2.0 这种纯版本号就是正式发布。
      #
      # 注意 `github.event.inputs` 只在 workflow_dispatch 时有值；
      # 打 tag 触发时它是空的，所以必须用 `||` 兜底，不能直接写进 if 的条件里
      # （未定义的值在表达式里会变成空字符串，容易判断反）。
      - name: Resolve release options
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        id: rel
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "tag 里带后缀 -> 标为预发布"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "纯版本号 tag -> 正式发布"
            fi
          else
            echo "tag=v0.2.0-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "手动触发 -> 用 run number 当 tag，并标为预发布"
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          # Resolve release options 一定会输出 prerelease（只在这个步骤该跑时才跑），
          # 所以这里不需要兜底默认值。之所以不写 `|| false`，是因为 YAML 1.1 会把
          # `false` 解析成布尔值再塞进表达式，类型不一致反而容易出问题。
          prerelease: ${{ steps.rel.outputs.prerelease }}
          # 名字里带上「测试版」，避免在 Releases 页面和正式版混淆
          name: ${{ startsWith(steps.rel.outputs.prerelease, 'true') && '【测试版】' || '' }}${{ steps.rel.outputs.tag }}

      # 手动触发且**没有**发 Release 时，走 Artifact 方便自己下载。
      # 保留期调短以免吃掉存储额度。
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: lvchecker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
