name: Build APK

# 只在「手动触发」或「打 tag」时构建。
# 刻意不配 on: push 到分支——否则每次推代码都烧 Actions 额度，
# 失败还会发邮件。改数据/改代码随时推，不影响这里。
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过 analyze/test（仅当测试本身出问题时用，快速出包）'
        type: boolean
        default: false
      publish_release:
        description: '构建完直接发一个 Release（测试版，预发布标记）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 锁定具体的 Flutter 版本，不用 channel: stable。
      # 否则上游发新版可能让构建在最不方便的时候突然红。
      # 要升级时改这一行并手动跑一次即可。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      # ------------------------------------------------------------------
      # 生成 Android 工程壳。
      #
      # 为什么不在仓库里提交 android/：
      #   那需要我手写 gradle 版本、AGP 版本、Kotlin 版本、wrapper 四件套。
      #   只要有一处和当前 Flutter 版本不匹配，CI 就会红，而且要反复试。
      #   交给 flutter create 用「与当前 Flutter 版本配套」的模板生成，
      #   是一次到位且零维护的做法。
      #
      # 为什么这样安全：
      #   flutter create 只会补齐缺失的平台文件，**不会覆盖**已有的
      #   lib/main.dart、pubspec.yaml、test/、data/、assets/。
      #   通过下面的 Assert 步骤显式校验这一点。
      # ------------------------------------------------------------------
      - name: Generate Android project shell
        run: flutter create --platforms=android --org io.github.gzlxz190614 .

      # 确认 `flutter create` 没有覆盖我们的源文件，且关键资源都在。
      #
      # ⚠️ 这一段以前是写死路径的 shell（`test -f assets/img/music/51/jacket.png`），
      #    图片格式从 PNG 换成 WebP 时它**直接挂了** —— 改格式的人不会想到
      #    去改 workflow 里的 shell。讽刺的是这个断言存在的意义就是防止资源
      #    出问题，结果它成了唯一因为资源改名而挂掉的东西。
      #
      #    现在改成调脚本，扩展名从 build.py 的 IMG_EXT 取（唯一真源），
      #    而且本地就能跑（`python tools/verify_repo.py`），不用推到 CI 试错。
      #
      #    注意 manifest 的检查**不在这里** —— 模板里本来就没有 INTERNET 权限，
      #    要等下面 patch 完再带 --expect-manifest 查一次（顺序搞反会误报）。
      - name: Verify repo invariants (sources not overwritten, assets)
        run: |
          set -e
          python3 tools/verify_repo.py
          test -f android/app/src/main/AndroidManifest.xml

      # ------------------------------------------------------------------
      # 改包名并把 minSdk 抬到 29（Android 10）。
      # Flutter 默认 minSdk 是 21，必须显式抬高才能保证你的常用机不变砖。
      # 用宽容匹配（同时兼容 `= 值` 与 `值` 两种写法），避免模板格式变化导致漏改。
      # ------------------------------------------------------------------
      - name: Set applicationId and minSdk = 29
        run: |
          set -e
          F=android/app/build.gradle.kts

          # 包名：io.github.gzlxz190614.lvchecker
          sed -i -E 's/^([[:space:]]*applicationId[[:space:]]*=[[:space:]]*).*$/\1"io.github.gzlxz190614.lvchecker"/' "$F"

          # minSdk：先尝试替换既有的 minSdk 行
          if grep -qE '^[[:space:]]*minSdk[[:space:]]*=' "$F"; then
            sed -i -E 's/^([[:space:]]*minSdk[[:space:]]*=[[:space:]]*).*$/\1 29/' "$F"
          else
            # 没有就插到 defaultConfig { 之后
            sed -i -E 's/^([[:space:]]*defaultConfig[[:space:]]*\{[[:space:]]*)$/\1\n        minSdk = 29/' "$F"
          fi

          echo '----- build.gradle.kts 关键行 -----'
          grep -nE 'applicationId|minSdk|namespace|compileSdk|targetSdk' "$F" || true

          echo '----- 断言：两项都改到了 -----'
          grep -q 'io.github.gzlxz190614.lvchecker' "$F"
          grep -qE 'minSdk[[:space:]]*=[[:space:]]*29' "$F"
          echo "OK: applicationId 与 minSdk=29 已生效"

      # 应用显示名 + **联网权限**。
      #
      # ⚠️ INTERNET 权限是必须在 release 里显式声明的，这是本项目最隐蔽的一个坑：
      #   `flutter create` 生成的模板里，INTERNET 只写在 debug/profile 的 manifest 里
      #   （那是给 Flutter 工具连 VM Service 用的），**主 manifest 里没有**。
      #   而 release APK 用主 manifest，所以**默认完全不能联网**。
      #
      #   它的表现非常像「被墙」：所有请求都抛 Failed host lookup（域名解析失败），
      #   于是「每个源都不通」看起来像网络问题，实际上 app 连 DNS 都没权限查。
      #
      #   实测症状：手机浏览器打开 raw 链接正常，但 app 里 6 个数据源**全部**报
      #   「域名解析失败」——连国内域名 Gitee 都不通。
      #   **「所有域名一起失败」就是缺权限的指纹**；真被墙只会是部分域名失败。
      #
      #   漏掉权限时**不会有任何编译期报错**，所以把补丁和断言都放进这个脚本，
      #   它自己会校验并在不满足时非零退出（见 tools/patch_android_manifest.py）。
      #   为什么不用 sed 内联：sed 的插入没法在本地验证，失败时 APK 照样能构建成功，
      #   只有装到手机上才会发现「又不能联网了」——又是一个「假绿勾」。
      - name: Set app display name and INTERNET permission
        run: |
          set -e
          python3 tools/patch_android_manifest.py \
            --manifest android/app/src/main/AndroidManifest.xml \
            --label "Linked VERSE Checker"

      # 补丁打完之后再验一次 manifest。
      #
      # 为什么不在上面那个脚本里一起查：patch 脚本自己验的是「我刚写进去的东西」，
      # 而这个脚本验的是「文件现在的状态」。两者都会抓到问题，但后者是独立的第二双眼睛
      # —— 万一以后有人加了别的步骤去改 manifest（flavor / manifest merger 之类），
      # 它还能兜住。
      - name: Verify manifest after patching
        run: python3 tools/verify_repo.py --expect-manifest

      # ------------------------------------------------------------------
      # 固定 release 签名 —— **这是「装新版要卸载、进度全丢」的根因**。
      #
      # CI 里没有签名配置时，`flutter build apk --release` 会用 **debug keystore** 签名，
      # 而 GitHub Actions 每次都是全新机器 —— 那个 keystore 每次都重新随机生成。
      # Android 规定签名不同的 APK 不能覆盖安装，只能先卸载；
      # 而 App 的打勾进度存在应用私有目录，卸载就一起没了。
      #
      # **版本号解决不了这个问题** —— 签名不固定的话，改多大版本号都得卸载重装。
      #
      # 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
      #   ANDROID_KEYSTORE_BASE64   keystore 文件的 base64
      #   ANDROID_KEYSTORE_PASSWORD keystore 口令
      #   ANDROID_KEY_ALIAS         别名
      #   ANDROID_KEY_PASSWORD      别名口令
      #
      # 没配 Secret 时会**跳过**（不是失败），但会打一条醒目警告 ——
      # 这样你第一次可以先照常出包，之后再补签名。
      # ------------------------------------------------------------------
      - name: Configure release signing (if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::warning::没有配置签名 Secret，本次 APK 会用每次随机生成的 debug 签名。"
            echo "::warning::后果：装新版必须先卸载，**本机进度会丢**。"
            echo "::warning::修复见 README「固定签名」一节（配 4 个 Secret）。"
            exit 0
          fi

          mkdir -p android/app
          # base64 可能因为粘贴时换行而带空格，先去掉空白
          printf '%s' "$KS_B64" | tr -d ' \n\r\t' | base64 -d > android/app/release.jks
          ls -l android/app/release.jks

          python3 tools/setup_android_signing.py \
            --app-dir android/app \
            --keystore android/app/release.jks \
            --props android/key.properties \
            --key-alias "$KEY_ALIAS" \
            --store-password "$KS_PASS" \
            --key-password "$KEY_PASS"

      - name: Get dependencies
        run: flutter pub get

      # 装 Pillow：工具脚本用它读写图片（见 tools/check_image_format.py）。
      #
      # 为什么 CI 需要它：仓库里的图是**已生成**的（工作流不重新生成图片），
      # 但 check_image_format.py 要打开图片、读出真实格式，才能发现
      # 「扩展名 .webp 实际是 PNG」这类问题 —— 那种问题编译期不报错，
      # 只有装到手机才满屏「图片丢失」。
      #
      # 顺带也保证了「这个仓库随时可以重新生成图片」：如果哪天源码要重建，
      # 不会因为 CI 里没有 Pillow 才发现。
      #
      # 装它大概几秒，相对于整个构建可以忽略。
      - name: Set up Python imaging (Pillow)
        run: |
          set -e
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "Pillow>=10"
          python3 -c "import PIL, PIL.features; print('Pillow', PIL.__version__)"
          python3 -c "import PIL.features, sys; sys.exit(0 if PIL.features.check('webp') else 1)"
          echo "OK: Pillow 可用且支持 WebP"

      # ------------------------------------------------------------------
      # 本地检查（因为无法在本地跑 flutter，这些静态校验就放在 CI 里）
      # ------------------------------------------------------------------
      # ⚠️ 这里**不能**跑 tools/check_music_order.py：它需要
      #    condition/MusicSort.xml，而 condition/ 是 gitignore 的（游戏解包资源），
      #    CI 上不存在，跑了必然失败。那个检查只能在本地跑。
      - name: Static checks (python / dart / assets / classes / gates schema / images)
        run: |
          set -e
          # 先按磁盘现状重建资源列表，再校验（避免「加了图但忘了声明」漏过）
          python3 tools/gen_asset_list.py
          # python 工具脚本自己的语法。这类错误（引号转义写错等）本地没有别的入口能发现，
          # 而它会让**后续所有检查一起崩**，所以放在最前面 —— 早点报出真正的错因。
          python3 tools/check_python_syntax.py
          python3 tools/check_dart.py
          python3 tools/check_assets.py
          python3 tools/check_classes.py
          # 门的结构约束。这些错**都不会报错**，只会静默判定错：
          #   * itemKey 不在 meta.json 里 -> 卡片不显示但 total 算上它，进度永远差一个；
          #   * itemsInSteps 的 steps 为空 -> total==0，门永远判未解锁；
          #   * 两步的 itemKey 重复       -> 一次勾选影响两处，两步退化成一步。
          # STAR 门原来就是「只判角色卡、不判 RANK 15」，属于同一类错。
          python3 tools/check_gates_schema.py
          # 段位序号的映射。`base=3` 必须映射到 CLASS III —— 但 tiers 是
          # **显示顺序** [∞,Ⅴ,Ⅳ,Ⅲ,Ⅱ,Ⅰ]，用 tiers[n-1] 会 6/6 全错、
          # 静默勾错段位（界面上看起来一切正常）。这个脚本从
          # class_course.dart 里抠出映射表来核对，不手抄一份 ——
          # 手抄的话源码改了检查不会跟着变，检查就失去意义。
          python3 tools/check_tier_order.py
          # 各门里有没有同一首歌出现两次（用户报过「同步时出现两个怒槌」，
          # 实际根因在 evaluateAllGates 没跳过未开放的门，但那属于 Dart 侧；
          # 数据侧也要保证没有真的重复条目）。
          python3 tools/check_duplicate_songs.py
          # 测试自身的陷阱：`evaluateAllGates` 默认跳过没有 releaseDate 的门，
          # 所以用它的测试必须给门 releaseDate —— 否则会以「什么都没扫描到」
          # 失败，而报错（Expected: true / Actual: <false>）和被测逻辑毫不相干。
          # 这个坑真实踩过，CI 挂了一次。只警告不失败（有些测试就是测跳过的）。
          python3 tools/check_tests_release_date.py
          # 图片格式：确认 Pillow 支持目标格式，且仓库里的图扩展名与实际格式一致。
          # 这两种问题的共同点是编译期发现不了，只有装到手机才满屏「图片丢失」。
          python3 tools/check_image_format.py
          # manifest 补丁脚本的自检。它负责的是「APK 有没有联网权限」，
          # 自己错了就毫无意义，所以在构建之前先验证它的逻辑（含失败路径）。
          python3 tools/patch_android_manifest.py --self-test
          # 签名注入脚本的产物静态检查。本机没有 Kotlin 编译器，验不了语法，
          # 但已知的几类错（全限定类名、裸的 r"、引号不成对、相对路径）
          # 可以在这里挡住 —— 那几类我各踩过一次，每次烧一轮 CI。
          python3 tools/check_gradle_snippet.py

      # 上面那批静态检查是不是真的能在 CI 上跑？
      # condition/ 是 gitignore 的（游戏解包资源），本地有、CI 没有 ——
      # 所以很容易写出「本地过、一上 CI 就炸」的检查
      # （check_music_order.py 就是这么炸的，白烧一轮构建）。
      #
      # 这一步用**空的 condition/ 占位**把 CI 环境复现出来，逐个比对输出，
      # 谁依赖 condition/ 就当场报出来。
      #
      # 在 CI 上本机就没有 condition/，脚本会检测到「无法模拟」并跳过 ——
      # 所以这一步主要在**本地**起作用（推之前先跑一遍）。
      - name: Verify static checks don't depend on local-only condition/
        run: python3 tools/check_ci_safety.py

      # 从仓库根目录的 icon.png 生成各密度启动图标。
      # 必须在 flutter pub get 之后跑（它依赖 flutter_launcher_icons 包）。
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # analyze 的 info/warning 不阻断（不该因为 lint 提示就出不了包），
      # **但 error 必须阻断**。
      #
      # 为什么这样写：Run #1 时这一步报了 2 个 error（undefined_class 等），
      # 却因为在 UI 上显示 success 而被忽略——问题只写在日志文字里。
      # 下面显式把 error 数出来并让它失败，避免再次出现「假绿勾」。
      - name: Analyze
        if: ${{ !inputs.skip_tests }}
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          cat analyze.log
          set -e
          # 匹配行的开头是 error 加空格（不依赖那个项目符号字符，避免编码差异）
          if grep -qE '^[[:space:]]*error[[:space:]]' analyze.log; then
            echo ""
            echo "❌ analyze 报了 error，构建中止。"
            echo "（info/warning 不阻断，error 阻断）"
            exit 1
          fi
          echo "OK: analyze 没有 error"

      # test 是阻断的：模型解析错了会导致整个 app 显示错数据，必须拦住。
      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: flutter test

      # 通用单包（不加 --split-per-abi），保证 Android 10 老机也能装。
      - name: Build release APK
        run: flutter build apk --release

      # 确认打出来的 APK **真的**带上了联网权限。
      #
      # 为什么要查「成品」而不是只查 manifest：manifest 补丁成功 ≠ APK 里有权限。
      # 中间还可能被 manifest merger、flavor、或别的 manifest 覆盖掉。
      # 之前那次「六个源全部域名解析失败」的教训就是：**构建成功不等于功能可用**，
      # 必须拿最终产物验证。aapt 在 Android SDK build-tools 里，runner 上一定有。
      - name: Show APK info
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/
          du -h "$APK"

          # 用 mapfile 而不是 `AAPT=$(find ... | sort | tail)`：后者在 `set -e` 下
          # 一旦 find 什么都没找到就会**静默退出整个步骤**，连下面那句人话错误都打不出来。
          # （`|| true` 能兜住管道最后一段，但读起来容易误解，不如显式判断。）
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mapfile -t AAPT_CANDIDATES < <(find "$SDK/build-tools" -name aapt -type f 2>/dev/null | sort -V)
          if [ "${#AAPT_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::在 $SDK/build-tools 下找不到 aapt，无法验证 APK 权限"
            exit 1
          fi
          AAPT="${AAPT_CANDIDATES[-1]}"
          echo "使用 $AAPT"

          echo '----- APK 里的权限 -----'
          # 先落到文件再 grep。不写成 `if aapt dump ... | grep -q` 是因为那样
          # aapt 自己失败（比如 APK 损坏）会被当成「没有这个权限」，报出误导性的原因。
          # 先让 aapt 跑完并检查退出码，再单独判断权限在不在。
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt

          echo '----- 断言：APK 必须声明 INTERNET -----'
          if grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo "OK: APK 已带 INTERNET 权限，热更新才有网络可用"
          else
            echo "::error::APK 里没有 INTERNET 权限 —— 装上去会完全无法联网（所有源都报域名解析失败）"
            exit 1
          fi

          # ---- 版本号与包名：和 pubspec / gradle 对齐 ----
          #
          # 为什么要查成品：版本号是唯一能证明「这个包比手机上那个新」的东西。
          # 如果 pubspec 改了但没生效（或反过来，构建悄悄回退了版本），
          # 你会装了半天发现还是同一个包，而构建是绿的。
          #
          # ⚠️ **不要把包名字符串写在这个脚本里**。
          #    踩过一次：写死 `grep -q "package: io.github.gzlxz190614.lvchecker"`
          #    之后，GitHub 的 secret 打码把脚本里那串替换成了 `***`
          #    （它匹配到了 Secret 值里的子串），于是 grep 拿字面量 `***` 去比，
          #    永远失败 —— 而 APK 明明是对的。所以改成从 build.gradle.kts 读
          #    applicationId 来对照，脚本里不出现那串名字。
          echo '----- 版本号与包名 -----'
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          EXPECTED_NAME=$(echo "$PUBSPEC_VERSION" | cut -d+ -f1)
          EXPECTED_CODE=$(echo "$PUBSPEC_VERSION" | cut -d+ -f2)
          echo "pubspec: $PUBSPEC_VERSION  -> versionName=$EXPECTED_NAME versionCode=$EXPECTED_CODE"

          # 只取 `aapt dump badging` 的第一行 package: —— 里面才有 versionCode/versionName
          "$AAPT" dump badging "$APK" | head -n 1 > /tmp/apk-badging.txt
          cat /tmp/apk-badging.txt

          APK_PKG=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" /tmp/apk-badging.txt)
          APK_NAME=$(sed -nE "s/.*versionName='([^']*)'.*/\1/p" /tmp/apk-badging.txt)
          APK_CODE=$(sed -nE "s/.*versionCode='([^']*)'.*/\1/p" /tmp/apk-badging.txt)

          GRADLE_APPID=$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)

          # 长度对比：万一包名里也有被 ::add-mask:: 打码的子串，
          # 内容对比会失败但长度对比仍然有效 —— 这是兜底信号，不是主要判据。
          echo "gradle applicationId 长度 = ${#GRADLE_APPID}"
          echo "APK 里的包名长度         = ${#APK_PKG}"
          echo "APK versionName=$APK_NAME versionCode=$APK_CODE"

          problems=""
          if [ -z "$APK_PKG" ]; then
            problems="$problems\n  ✗ 读不出 APK 的包名"
          fi
          if [ -z "$GRADLE_APPID" ]; then
            problems="$problems\n  ✗ 读不出 gradle 的 applicationId"
          fi
          if [ -n "$APK_PKG" ] && [ -n "$GRADLE_APPID" ] && [ "$APK_PKG" != "$GRADLE_APPID" ]; then
            problems="$problems\n  ✗ APK 包名与 gradle applicationId 不一致"
          fi
          if [ "${#APK_PKG}" != "${#GRADLE_APPID}" ]; then
            problems="$problems\n  ✗ 包名长度不同（${#APK_PKG} vs ${#GRADLE_APPID}）"
          fi
          # 用显式 if 而不是 `[ ... ] && problems=...`：
          # 后者在 `bash -e` 下的行为依赖「短路列表末尾退出码被忽略」这条细则，容易踩坑。
          if [ "$APK_NAME" != "$EXPECTED_NAME" ]; then
            problems="$problems\n  ✗ versionName='$APK_NAME'，pubspec 期望 '$EXPECTED_NAME'"
          fi
          if [ "$APK_CODE" != "$EXPECTED_CODE" ]; then
            problems="$problems\n  ✗ versionCode='$APK_CODE'，pubspec 期望 '$EXPECTED_CODE'"
          fi

          if [ -n "$problems" ]; then
            echo "::error::APK 元信息校验失败："
            printf '%b\n' "$problems"
            exit 1
          fi
          echo "OK: 包名与 gradle 一致；versionName=$APK_NAME versionCode=$APK_CODE"

      # 发 Release：附件不计入 Actions 存储额度，而且给出一个固定下载链接，
      # 手机上点开就能装。
      #
      # 两条触发路径、都能标「预发布」：
      #   · 打 tag（v0.2.0-rc.1 这种带后缀的）→ 自动标 prerelease
      #   · 手动触发并勾上 publish_release → 用 run number 当 tag，标 prerelease
      #
      # 为什么 tag 里带 `-` 就自动当预发布：这样「测试版」不需要额外操作，
      # 只要是 v0.2.0-rc.1 / v0.2.0-test.1 这类 tag，GitHub 上就不会显示成 Latest。
      # 反之 v0.2.0 这种纯版本号就是正式发布。
      #
      # 注意 `github.event.inputs` 只在 workflow_dispatch 时有值；
      # 打 tag 触发时它是空的，所以必须用 `||` 兜底，不能直接写进 if 的条件里
      # （未定义的值在表达式里会变成空字符串，容易判断反）。
      - name: Resolve release options
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        id: rel
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "tag 里带后缀 -> 标为预发布"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "纯版本号 tag -> 正式发布"
            fi
          else
            echo "tag=v0.2.0-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "手动触发 -> 用 run number 当 tag，并标为预发布"
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          # Resolve release options 一定会输出 prerelease（只在这个步骤该跑时才跑），
          # 所以这里不需要兜底默认值。之所以不写 `|| false`，是因为 YAML 1.1 会把
          # `false` 解析成布尔值再塞进表达式，类型不一致反而容易出问题。
          prerelease: ${{ steps.rel.outputs.prerelease }}
          # 名字里带上「测试版」，避免在 Releases 页面和正式版混淆
          name: ${{ startsWith(steps.rel.outputs.prerelease, 'true') && '【测试版】' || '' }}${{ steps.rel.outputs.tag }}

      # 手动触发且**没有**发 Release 时，走 Artifact 方便自己下载。
      # 保留期调短以免吃掉存储额度。
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: lvchecker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
